<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Arras Mail</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080808;
    }

    /* =========================
       WEBSITE
    ========================= */

    #mailFrame {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      border: 0;
      background: white;
    }

    /* =========================
       LOADING SCREEN
    ========================= */

    #loading {
      position: fixed;
      inset: 0;

      z-index: 9999;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at center,
          #181818 0%,
          #080808 60%,
          #000 100%
        );

      transition:
        opacity .7s ease,
        visibility .7s ease;
    }

    #loading.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* =========================
       CONTENT
    ========================= */

    .loader-container {
      width: min(88vw, 430px);

      text-align: center;

      animation: appear .6s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(12px) scale(.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* =========================
       GLASS VIDEO PLAYER
    ========================= */

    .video-glass {
      position: relative;

      padding: 7px;

      border-radius: 20px;

      background: rgba(255,255,255,.07);

      border: 1px solid rgba(255,255,255,.14);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      box-shadow:
        0 20px 60px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.08);
    }

    .anime-video {
      width: 100%;

      display: block;

      aspect-ratio: 16 / 9;

      object-fit: cover;

      border-radius: 14px;

      background: #111;
    }

    /* =========================
       PERCENTAGE
    ========================= */

    .percentage {
      margin-top: 24px;

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 34px;

      font-weight: 700;

      letter-spacing: -1px;
    }

    .loading-text {
      margin-top: 5px;

      color: rgba(255,255,255,.62);

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 13px;
    }

    /* =========================
       PROGRESS BAR
    ========================= */

    .progress-wrapper {
      width: 100%;

      height: 5px;

      margin-top: 18px;

      overflow: hidden;

      border-radius: 999px;

      background: rgba(255,255,255,.1);

      border: 1px solid rgba(255,255,255,.05);
    }

    .progress {
      width: 0%;

      height: 100%;

      border-radius: inherit;

      background: linear-gradient(
        90deg,
        #ffffff,
        #bdbdbd
      );

      box-shadow:
        0 0 12px rgba(255,255,255,.35);

      transition: width .15s ease;
    }

    /* =========================
       SMALL STATUS
    ========================= */

    .status {
      margin-top: 10px;

      color: rgba(255,255,255,.35);

      font-family: Arial, sans-serif;

      font-size: 11px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 480px) {

      .loader-container {
        width: 88vw;
      }

      .video-glass {
        padding: 5px;
        border-radius: 17px;
      }

      .anime-video {
        border-radius: 12px;
      }

      .percentage {
        font-size: 30px;
        margin-top: 20px;
      }

      .progress-wrapper {
        margin-top: 15px;
      }
    }
  </style>
</head>

<body>

  <!-- TEMP ARRAS MAIL -->
  <iframe
    id="mailFrame"
    src="https://temp.arras-mail.my.id"
    allow="clipboard-read; clipboard-write; fullscreen"
    loading="eager">
  </iframe>


  <!-- LOADING -->
  <div id="loading">

    <div class="loader-container">

      <!-- Glass Video -->
      <div class="video-glass">

        <video
          id="animeVideo"
          class="anime-video"
          autoplay
          muted
          loop
          playsinline
          preload="auto">

          <!-- GANTI URL VIDEO DI SINI -->
          <source
            src="https://files.catbox.moe/nc63iv.mp4"
            type="video/mp4">

        </video>

      </div>


      <!-- Percentage -->
      <div
        id="percentage"
        class="percentage">
        0%
      </div>


      <!-- Text -->
      <div class="loading-text">
        Memuat Arras Mail
      </div>


      <!-- Progress -->
      <div class="progress-wrapper">

        <div
          id="progress"
          class="progress">
        </div>

      </div>


      <!-- Status -->
      <div
        id="status"
        class="status">
        Menyiapkan halaman...
      </div>

    </div>

  </div>


  <script>

    const frame =
      document.getElementById("mailFrame");

    const loading =
      document.getElementById("loading");

    const percentage =
      document.getElementById("percentage");

    const progress =
      document.getElementById("progress");

    const status =
      document.getElementById("status");


    let frameLoaded = false;
    let currentProgress = 0;


    /*
     * Animasi progress 0 → 100
     *
     * Dibuat smooth dan tidak terlalu cepat
     * agar loading terasa natural.
     */

    const progressTimer =
      setInterval(() => {

        if (currentProgress < 90) {

          /*
           * Kecepatan progress makin lambat
           * mendekati 90%.
           */

          let increment;

          if (currentProgress < 30) {
            increment = 2.5;
          }

          else if (currentProgress < 60) {
            increment = 1.5;
          }

          else {
            increment = 0.5;
          }

          currentProgress += increment;

          updateProgress();

        }

      }, 100);


    function updateProgress() {

      const value =
        Math.min(
          Math.floor(currentProgress),
          100
        );

      percentage.textContent =
        value + "%";

      progress.style.width =
        value + "%";


      if (value < 30) {

        status.textContent =
          "Menyiapkan halaman...";

      }

      else if (value < 60) {

        status.textContent =
          "Menghubungkan ke Arras Mail...";

      }

      else if (value < 90) {

        status.textContent =
          "Memuat antarmuka...";

      }

      else {

        status.textContent =
          "Hampir selesai...";

      }

    }


    /*
     * iframe selesai dimuat
     */

    frame.addEventListener(
      "load",
      () => {

        frameLoaded = true;

        finishLoading();

      }
    );


    /*
     * Setelah iframe siap,
     * progress dipaksa menuju 100%.
     */

    function finishLoading() {

      clearInterval(progressTimer);

      const finish =
        setInterval(() => {

          currentProgress += 4;

          if (currentProgress >= 100) {

            currentProgress = 100;

            updateProgress();

            clearInterval(finish);

            status.textContent =
              "Selesai";

            setTimeout(() => {

              loading.classList.add("hide");

            }, 350);

          }

          else {

            updateProgress();

          }

        }, 25);

    }


    /*
     * Fallback.
     *
     * Kalau iframe gagal memberikan event load,
     * loading tetap dilepas setelah 15 detik.
     */

    setTimeout(() => {

      if (!frameLoaded) {

        clearInterval(progressTimer);

        currentProgress = 100;

        updateProgress();

        status.textContent =
          "Selesai";

        setTimeout(() => {

          loading.classList.add("hide");

        }, 400);

      }

    }, 15000);

  </script>

</body>
</html>
