<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>temp-kilzz</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #0f1117;
            color: #fff;

            font-family: Arial, sans-serif;
        }

        .card {
            width: min(90%, 420px);
            padding: 32px;

            text-align: center;

            background: #181b24;
            border: 1px solid #2a2f3b;
            border-radius: 18px;

            box-shadow: 0 15px 40px rgba(0,0,0,.35);
        }

        .status {
            display: inline-block;

            margin-bottom: 20px;
            padding: 7px 14px;

            border-radius: 999px;

            background: #163d29;
            color: #55e69a;

            font-size: 13px;
            font-weight: bold;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 32px;
        }

        p {
            color: #9da3b4;
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <main class="card">

        <div class="status">
            DEPLOYMENT OK
        </div>

        <h1>temp-kilzz</h1>

        <p>
            Project berhasil dibuat menggunakan
            Kilzz Tools.
        </p>

    </main>

</body>
</html>
